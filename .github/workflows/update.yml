name: Update Schedule

on:
  schedule:
    # Запуск каждый день в 20:00 по Москве (17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Игнорировать защиту от потери событий (если расписание легально стало короче)'
        required: false
        default: false
        type: boolean

# Даем права на запись в репозиторий (чтобы делать коммит)
permissions:
  contents: write

# Защита от одновременного запуска двух копий
concurrency:
  group: schedule-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          # Передаем флаг, если нажата галочка force_update при ручном запуске
          FORCE_UPDATE: ${{ inputs.force_update == true && '1' || '0' }}
          # Можно переопределить минимальное число событий (полезно во время сессии)
          MIN_STUDY_EVENTS: 10
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # Добавляем все измененные и новые файлы (кроме тех, что в .gitignore)
          git add -A
          
          # Если изменений нет, команда завершится без ошибки
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита."
          else
            git commit -m "Auto-update schedule and changes"
            git push
          fi
